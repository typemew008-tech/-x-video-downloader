<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>X 视频提取器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">OPEN SOURCE · X VIDEO</div>
      <h1>粘贴链接，提取视频。</h1>
      <p>支持公开的 X / Twitter 帖子。无需登录，手机 Safari 也能使用。</p>
    </section>

    <section class="card">
      <form id="form">
        <div class="input-row">
          <input id="url" type="url" inputmode="url"
                 autocomplete="off"
                 placeholder="粘贴 X 帖子链接，例如 https://x.com/.../status/..."
                 required>
          <button id="extract" type="submit">提取视频</button>
        </div>
      </form>

      <div id="message" class="message hidden"></div>

      <section id="result" class="result hidden">
        <div class="preview-wrap">
          <img id="thumb" class="thumb hidden" alt="">
          <video id="video" class="video hidden" controls playsinline preload="metadata"></video>
        </div>

        <div class="meta">
          <div>
            <div id="title" class="title"></div>
            <div id="uploader" class="sub"></div>
          </div>
          <div id="formats" class="formats"></div>
        </div>

        <button id="download" class="download" type="button">下载 MP4</button>
      </section>
    </section>

    <footer>
      <span>仅用于下载你有权访问和保存的公开内容。</span>
      <span>请遵守 X 的服务条款及版权规定。</span>
    </footer>
  </main>

<script>
const form = document.querySelector('#form');
const urlInput = document.querySelector('#url');
const extractBtn = document.querySelector('#extract');
const message = document.querySelector('#message');
const result = document.querySelector('#result');
const thumb = document.querySelector('#thumb');
const video = document.querySelector('#video');
const title = document.querySelector('#title');
const uploader = document.querySelector('#uploader');
const formats = document.querySelector('#formats');
const downloadBtn = document.querySelector('#download');

let currentUrl = '';

function showMessage(text, type='error') {
  message.textContent = text;
  message.className = `message ${type}`;
}
function hideMessage() {
  message.className = 'message hidden';
}
function formatBytes(n) {
  if (!n) return '';
  const units = ['B','KB','MB','GB'];
  let i = 0, x = n;
  while (x >= 1024 && i < units.length - 1) { x /= 1024; i++; }
  return `${x.toFixed(i ? 1 : 0)} ${units[i]}`;
}
function setLoading(loading) {
  extractBtn.disabled = loading;
  extractBtn.textContent = loading ? '解析中…' : '提取视频';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = urlInput.value.trim();
  if (!url) return;

  hideMessage();
  result.classList.add('hidden');
  video.classList.add('hidden');
  thumb.classList.add('hidden');
  setLoading(true);
  currentUrl = url;

  try {
    const r = await fetch('/api/info', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '解析失败');

    title.textContent = data.title || 'X 视频';
    uploader.textContent = data.uploader ? `@${data.uploader}` : '';
    if (data.thumbnail) {
      thumb.src = data.thumbnail;
      thumb.classList.remove('hidden');
    }

    formats.innerHTML = '';
    (data.formats || []).forEach((f, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'format';
      b.textContent = `${f.height ? f.height + 'p' : '视频'}${f.fps ? ' · ' + f.fps + 'fps' : ''}${f.filesize ? ' · ' + formatBytes(f.filesize) : ''}`;
      b.onclick = () => {
        video.src = f.url;
        video.classList.remove('hidden');
        thumb.classList.add('hidden');
      };
      formats.appendChild(b);
    });

    if (data.best?.url) {
      video.src = data.best.url;
      video.classList.remove('hidden');
      thumb.classList.add('hidden');
    }

    result.classList.remove('hidden');
  } catch (err) {
    showMessage(err.message || '解析失败');
  } finally {
    setLoading(false);
  }
});

downloadBtn.addEventListener('click', async () => {
  if (!currentUrl) return;
  downloadBtn.disabled = true;
  downloadBtn.textContent = '下载中…';

  try {
    const r = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: currentUrl})
    });

    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || '下载失败');
    }

    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'x-video.mp4';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (err) {
    showMessage(err.message || '下载失败');
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = '下载 MP4';
  }
});
</script>
</body>
</html>
